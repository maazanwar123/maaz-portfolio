<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#004080;
    color:white;
    text-align:center;
    padding:20px;
}

nav{
    background:#003366;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

.login-box{
    width:400px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

.login-box h2{
    text-align:center;
    color:#004080;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    background:#004080;
    color:white;
    border:none;
    padding:12px;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#003366;
}

#message{
    text-align:center;
    color:red;
    margin-top:15px;
}

footer{
    background:#003366;
    color:white;
    text-align:center;
    padding:15px;
    position:fixed;
    bottom:0;
    width:100%;
}

</style>
</head>

<body>

<header>
    <h1>Online Examination System</h1>
</header>

<nav>
    <a href="index.html">Home</a>
</nav>

<div class="login-box">

    <h2>Student Login</h2>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Enter Username"
            required>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

</div>

<footer>
    <p>&copy; 2026 Online Examination System</p>
</footer>

<script src="login.js"></script>

</body>
</html>
