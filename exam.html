<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Examination</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
}

header{
    background:#004080;
    color:white;
    text-align:center;
    padding:15px;
}

.container{
    width:80%;
    max-width:800px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

#timer{
    font-size:24px;
    font-weight:bold;
    color:red;
    text-align:right;
}

#question{
    margin:20px 0;
}

.option{
    display:block;
    margin:10px 0;
}

.buttons{
    margin-top:20px;
}

button{
    background:#004080;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
    margin-right:10px;
}
</style>
</head>
<body>

<header>
    <h1>Online Examination</h1>
</header>

<div class="container">

    <div id="timer">05:00</div>

    <h2 id="question"></h2>

    <div id="options"></div>

    <div class="buttons">
        <button onclick="previousQuestion()">Previous</button>
        <button onclick="nextQuestion()">Next</button>
        <button onclick="submitExam()">Submit Exam</button>
    </div>

</div>

<script>
if(localStorage.getItem("loggedIn") !== "true"){
    window.location.href="login.html";
}

const questions = [
{
question:"What does HTML stand for?",
options:[
"Hyper Text Markup Language",
"High Text Machine Language",
"Home Tool Markup Language",
"Hyperlinks Text Mark Language"
],
answer:0
},
{
question:"Which language is used for styling webpages?",
options:["Java","Python","CSS","PHP"],
answer:2
},
{
question:"Which company developed JavaScript?",
options:["Google","Microsoft","Netscape","Apple"],
answer:2
},
{
question:"Which tag creates a hyperlink?",
options:["a","link","href","url"],
answer:0
},
{
question:"Which symbol is used for comments in JavaScript?",
options:["//","##","!-- --","**"],
answer:0
}
];

let currentQuestion=0;
let answers=[];

function loadQuestion(){

let q=questions[currentQuestion];

document.getElementById("question").innerHTML=
(currentQuestion+1)+". "+q.question;

let html="";

q.options.forEach((option,index)=>{

html+=`
<label class="option">
<input type="radio" name="option" value="${index}">
${option}
</label>
`;

});

document.getElementById("options").innerHTML=html;
}

function saveAnswer(){
let selected=
document.querySelector('input[name="option"]:checked');

if(selected){
answers[currentQuestion]=Number(selected.value);
}
}

function nextQuestion(){
saveAnswer();

if(currentQuestion<questions.length-1){
currentQuestion++;
loadQuestion();
}
}

function previousQuestion(){

saveAnswer();

if(currentQuestion>0){
currentQuestion--;
loadQuestion();
}
}

function submitExam() {

    saveAnswer();

    let score = 0;

    questions.forEach((q, index) => {
        if (answers[index] === q.answer) {
            score++;
        }
    });

    // Data to send to PHP
    const data = new FormData();

    data.append(
        "username",
        localStorage.getItem("studentName")
    );

    data.append("score", score);
    data.append("total", questions.length);

    fetch("save_result.php", {
        method: "POST",
        body: data
    })
    .then(response => response.text())
    .then(result => {

        console.log(result);

        if(result === "Saved") {

            localStorage.setItem("score", score);
            localStorage.setItem("total", questions.length);

            window.location.href = "result.html";
        }
        else {
            alert("Database Error: " + result);
        }

    })
    .catch(error => {
        console.error(error);
        alert("Failed to save result.");
    });
}

let timeLeft=300;

const timer=setInterval(()=>{

let minutes=Math.floor(timeLeft/60);
let seconds=timeLeft%60;

document.getElementById("timer").innerHTML=
`${minutes}:${seconds<10?'0':''}${seconds}`;

timeLeft--;

if(timeLeft<0){
clearInterval(timer);
submitExam();
}

},1000);

loadQuestion();
</script>

</body>
</html>
